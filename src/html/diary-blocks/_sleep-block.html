<section class="diary__sleep" x-data="{open:false,wake:'06:30',bed:'22:30'}">
    <button type="button" class="diary__sleep-head" @click="open=!open" :aria-expanded="open.toString()" aria-controls="diary-sleep-body">
        <span class="diary__sleep-title">Подъём / уход ко сну</span>
        <span class="diary__sleep-sum"><span><i class="icon-sun" aria-hidden="true"></i><b x-text="wake"></b></span><span><i class="icon-moon" aria-hidden="true"></i><b x-text="bed"></b></span></span>
        <span class="diary__sleep-chev icon-down" aria-hidden="true"></span>
    </button>
    <div id="diary-sleep-body" class="diary__sleep-fields" x-show="open" x-cloak>
        <label>Подъём <span class="diary__time-field"><input x-ref="wakeInput" data-sleep-wake="06:30" :data-sleep-wake="wake" value="06:30" :value="wake" class="input input-sm" type="time" @change="if(/^(?:[01]\d|2[0-3]):[0-5]\d$/.test($el.value)){wake=$el.value;$nextTick(()=>$dispatch('diary:sleep'))}else{$el.value=wake}" @blur="if(!$el.value)$el.value=wake" :disabled="!editable"><button type="button" class="icon-clock" @click="$refs.wakeInput.focus({preventScroll:true});if($refs.wakeInput.showPicker)$refs.wakeInput.showPicker()" :disabled="!editable" aria-label="Выбрать время подъёма"></button></span></label>
        <label>Уход ко сну <span class="diary__time-field"><input x-ref="bedInput" data-sleep-bed="22:30" :data-sleep-bed="bed" value="22:30" :value="bed" class="input input-sm" type="time" @change="if(/^(?:[01]\d|2[0-3]):[0-5]\d$/.test($el.value)){bed=$el.value;$nextTick(()=>$dispatch('diary:sleep'))}else{$el.value=bed}" @blur="if(!$el.value)$el.value=bed" :disabled="!editable"><button type="button" class="icon-clock" @click="$refs.bedInput.focus({preventScroll:true});if($refs.bedInput.showPicker)$refs.bedInput.showPicker()" :disabled="!editable" aria-label="Выбрать время отхода ко сну"></button></span></label>
    </div>
</section>
